spring:
  application:
    name: lucid-lynx-market-signals
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/market_signals}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: ${PORT:8080}

rsi:
  period: 14
  oversold-threshold: 30
  overbought-threshold: 70
  
  polling:
    interval-seconds: 300
    ig-interval-seconds: 900

  cooldown-minutes: 120
  watch-proximity-threshold: ${WATCH_PROXIMITY_THRESHOLD:40}
  partial-require-fast-tf-aligned: ${PARTIAL_REQUIRE_FAST_TF:true}
  partial-signals-enabled: ${PARTIAL_SIGNALS_ENABLED:false}
  watch-signals:
    enabled: ${WATCH_SIGNALS_ENABLED:false}

  quiet-hours:
    enabled: true
    start-hour: 22
    end-hour: 8
    suppress-partials-on-weekends: true

  market-hours:
    ig-start-utc: 6
    ig-end-utc: 22
    ig-sunday-start-utc: 22

  partial-monitoring:
    enabled: ${PARTIAL_MONITORING_ENABLED:true}
    window-minutes: ${PARTIAL_MONITORING_WINDOW:60}
    follow-up-interval-minutes: ${PARTIAL_MONITORING_INTERVAL:30}
    max-initial-gap: ${PARTIAL_MAX_INITIAL_GAP:8}

  demo:
    account-balance: 10000
    account-currency: EUR
    risk-percent: 1
    # Fixed-pct stops — used as fallback when ATR data insufficient
    stop-percent-crypto: 2.0
    stop-percent-index: 1.0
    stop-percent-commodity: 1.0
    # ATR-based stops — adapts to current volatility (1.5× ATR trend, 2× ATR OB/OS)
    # Sampled on 15m timeframe; falls back to fixed-pct if < period+1 candles available
    atr-stops-enabled: ${ATR_STOPS_ENABLED:true}
    atr-period: ${ATR_PERIOD:14}
    atr-multiplier-trend: ${ATR_MULTIPLIER_TREND:1.5}
    atr-multiplier-default: ${ATR_MULTIPLIER_DEFAULT:2.0}
    # Reward:Risk by asset class (trend signals only; non-trend always uses 2:1)
    # Crypto lowered to 2:1 — SOL 5 wins were all 24h auto-closes, 3:1 target never hit
    trend-rr-crypto: ${TREND_RR_CRYPTO:2.0}
    trend-rr-index: ${TREND_RR_INDEX:3.0}
    trend-rr-commodity: ${TREND_RR_COMMODITY:3.0}
    # Trailing-stop geometry (paper replay, live IG ratchet, and the Telegram "🪜 Trail:" guidance
    # all read these). Multipliers are of the INITIAL stop distance (stopPts).
    #   activation-mult: move stop to breakeven once unrealised gain reaches this × stop
    #   distance-mult:   trail this × stop below new extremes thereafter
    # Jun 23 2026: loosened from a hardcoded 0.5/0.5 to 1.0/1.0. At 0.5 the stop snapped to
    # breakeven at +0.5R and trailed only half a stop away, so in low-vol (tight ATR) regimes
    # winners were exited at ~breakeven on the first wiggle (the Jun 20-22 +€10/€17/€32 scratches).
    # 1.0/1.0 gives the trade a full stop of room before breakeven and trails a full stop wide,
    # letting runners run (more give-back risk, accepted per the "one runner pays for losers" model).
    trail-activation-mult: ${TRAIL_ACTIVATION_MULT:1.0}
    trail-distance-mult: ${TRAIL_DISTANCE_MULT:1.0}
    
  trend:
    ema-period: ${TREND_EMA_PERIOD:20}
    ema-timeframe: ${TREND_EMA_TIMEFRAME:1h}
    consecutive-signals-for-trend: ${TREND_CONSECUTIVE_SIGNALS:2}
    # Apr 24 2026: lowered 60 → 45. At 60, 22 of 22 closed TREND_BUY_DIP trades missed TP
    # because "fast-TF RSI < 60" fires at mere neutral (RSI ~55) — entries land at the
    # top of micro-pullbacks, not real dip bottoms. 45 targets the Investopedia-cited
    # "deep pullback in uptrend" zone. Revisit after 20+ trades.
    dip-rsi-threshold: ${TREND_DIP_RSI_THRESHOLD:45}     # reverted 50→45 May 28 2026 — 50 fired at neutral RSI (45-49), producing false-positive dips on Oil/BTC/S&P that were not real pullbacks. 45 = researched deep-pullback zone (see lines above).
    rally-rsi-threshold: ${TREND_RALLY_RSI_THRESHOLD:55}
    trend-timeout-hours: ${TREND_TIMEOUT_HOURS:12}
    suppress-counter-trend: ${TREND_SUPPRESS_COUNTER:true}
    sell-rally-enabled: ${TREND_SELL_RALLY_ENABLED:false}
    # ADX(14) trend-strength filter on the trend timeframe (1h). Skips TREND_BUY_DIP /
    # TREND_SELL_RALLY when the market is ranging (Schwab/Investopedia: ADX<20 = no trend).
    # Set enabled=false to disable; threshold=0 also effectively disables.
    adx-filter-enabled: ${TREND_ADX_FILTER_ENABLED:true}
    adx-period: ${TREND_ADX_PERIOD:14}
    adx-threshold: ${TREND_ADX_THRESHOLD:12.0}     # lowered 20→15 May 2026; 15→12 Jun 23 2026 — ADX_RANGING was the most-firing 'marginal' suppressor (ETH 1410 supp, +0.73% next-day = missed wins). 12 releases more signals per user's "prefer more signals, I'll decide" preference.
    # MACD histogram confirmation for TREND_BUY_DIP (Appel 1979).
    # Blocks entry when histogram is not bullish AND not rising on the trend timeframe.
    # Set enabled=false to disable; fast/slow/signal periods mirror the classic 12/26/9.
    macd-filter-enabled: ${TREND_MACD_FILTER_ENABLED:true}
    macd-fast-period: ${TREND_MACD_FAST_PERIOD:12}
    macd-slow-period: ${TREND_MACD_SLOW_PERIOD:26}
    macd-signal-period: ${TREND_MACD_SIGNAL_PERIOD:9}
    # Crypto volume confirmation for TREND_BUY_DIP — high volume validates pullbacks per LuxAlgo / r/algotrading.
    # IG CFD volume is unreliable; filter only applies to CRYPTO instruments.
    crypto-volume-filter-enabled: ${TREND_CRYPTO_VOLUME_FILTER_ENABLED:false}  # disabled May 2026 — was blocking valid pullbacks; re-enable if noise increases
    crypto-volume-multiplier: ${TREND_CRYPTO_VOLUME_MULTIPLIER:1.2}
    crypto-volume-lookback: ${TREND_CRYPTO_VOLUME_LOOKBACK:20}
    # MACD divergence gate for TREND_BUY_DIP (deployed OFF — monitor via filter_event_counts for 1 week before enabling).
    # Bullish divergence confirms entry; absence when histogram is weak blocks entry.
    # When histogram is clearly bullish (>0 AND rising), entry passes regardless.
    macd-divergence-enabled: ${TREND_MACD_DIVERGENCE_ENABLED:false}
    # EMA slope filter — gates TREND_BUY_DIP / TREND_SELL_RALLY on the EMA itself trending,
    # not just price > EMA. Price-above-EMA alone is too permissive in tight consolidation
    # ranges (e.g. SOL Mar 19–21 2026 fired 3× while drifting in $85.15–$86.14 range).
    # Slope is computed as (EMA_now − EMA_{n back}) / EMA_{n back}. Default ON, gentle 0.05%
    # threshold so only true flat-chop is filtered.
    ema-slope-filter-enabled: ${TREND_EMA_SLOPE_FILTER_ENABLED:true}
    ema-slope-lookback: ${TREND_EMA_SLOPE_LOOKBACK:5}
    # Loosened 0.05%→0.03% (Jun 20 2026): the suppression retrospective showed SOL candles
    # blocked by EMA_SLOPE_FLAT rose +0.57% next-day on average (missed wins, marginal verdict),
    # while ADX_RANGING was correctly catching the genuine falls. 0.03% still filters dead-flat
    # chop but lets gently-rising dips through. Revisit if SOL win rate drops.
    ema-slope-min-pct: ${TREND_EMA_SLOPE_MIN_PCT:0.03}
    # ATR / price minimum — blocks TREND_BUY_DIP when 1h ATR is too small relative to price
    # (low-volatility range). Disabled by default — needs calibration against position_outcomes
    # before enabling. 0.4% is a starting point for crypto; indices/commodities typically lower.
    atr-min-pct-filter-enabled: ${TREND_ATR_MIN_PCT_FILTER_ENABLED:false}
    atr-min-pct: ${TREND_ATR_MIN_PCT:0.4}
    atr-min-pct-period: ${TREND_ATR_MIN_PCT_PERIOD:14}
    # Dedupe tightening (May 2026) — second SOL alert within 60h at near-identical price
    # was firing because dipRsiRecovered flipped true the moment 15m RSI brushed 50.
    # Now requires recovery to threshold + margin AND a larger price move when not recovered.
    dip-recovery-margin: ${TREND_DIP_RECOVERY_MARGIN:5.0}
    dip-min-pct-move: ${TREND_DIP_MIN_PCT_MOVE:0.5}
    # Falling-knife / drawdown-velocity guard (Jun 2026) — blocks TREND_BUY_DIP when price has
    # dropped more than dip-max-drop-pct over the last dip-max-drop-lookback fast-TF candles, i.e.
    # a violent fall rather than a healthy pullback. Added after SOL entered at 74.35 mid-knife
    # (prior close 74.94) while all trend filters passed, then kept falling.
    # DISABLED by default (Jun 20 2026): even at 2.0% this sits on the SAME fast timeframe whose
    # RSI pullback *defines* a dip, so it structurally fights the signal it guards — it caused a
    # week-long TREND_BUY_DIP drought (0.6%→2.0% on Jun 18 was not enough). Per the trailing-stop
    # economics (one runner pays for several small losers), missing real dips costs more than the
    # occasional mid-knife entry. Re-enable with a higher pct (e.g. 3-4%) only if knife entries
    # become a measurable drag in position_outcomes.
    dip-max-drop-filter-enabled: ${TREND_DIP_MAX_DROP_FILTER_ENABLED:false}
    dip-max-drop-pct: ${TREND_DIP_MAX_DROP_PCT:2.0}
    dip-max-drop-lookback: ${TREND_DIP_MAX_DROP_LOOKBACK:3}

  correlation:
    lookback-minutes: ${CORRELATION_LOOKBACK_MINUTES:15}
    min-instruments-for-regime: ${CORRELATION_MIN_INSTRUMENTS:3}
    price-change-threshold-pct: ${CORRELATION_PRICE_CHANGE_THRESHOLD:0.5}

  volatility:
    atr-period: ${VOLATILITY_ATR_PERIOD:14}
    atr-lookback: ${VOLATILITY_ATR_LOOKBACK:20}
    expansion-threshold: ${VOLATILITY_EXPANSION_THRESHOLD:2.0}  # raised 1.5→2.0 May 2026 — was blocking SOL signals (HIGH_VOLATILITY 9× in 2 days)
    min-instruments: ${VOLATILITY_MIN_INSTRUMENTS:3}           # raised 2→3 — require broader market expansion before suppressing

  timeframes:
    - 1m
    - 5m
    - 1h
    - 4h
    - 1d

market:
  binance:
    base-url: https://api.binance.com

  finnhub:
    api-key: ${FINNHUB_API_KEY:}
    base-url: https://finnhub.io/api/v1

  ig:
    enabled: ${IG_ENABLED:false}
    api-key: ${IG_API_KEY:}
    username: ${IG_USERNAME:}
    password: ${IG_PASSWORD:}
    base-url: ${IG_BASE_URL:https://demo-api.ig.com/gateway/deal}

claude:
  enabled: ${CLAUDE_ENABLED:false}
  api-key: ${CLAUDE_API_KEY:}
  model: ${CLAUDE_MODEL:claude-3-haiku-20240307}
  base-url: https://api.anthropic.com

deepseek:
  enabled: ${DEEPSEEK_ENABLED:false}
  api-key: ${DEEPSEEK_API_KEY:}
  model: ${DEEPSEEK_MODEL:deepseek-chat}
  base-url: https://api.deepseek.com

trading:
  auto-execution:
    enabled: ${TRADING_AUTO_EXECUTION_ENABLED:false}
    max-position-percent: ${TRADING_MAX_POSITION_PERCENT:2}
    max-concurrent-positions: ${TRADING_MAX_CONCURRENT_POSITIONS:2}
    daily-loss-limit-percent: ${TRADING_DAILY_LOSS_LIMIT_PERCENT:2}
    require-manual-approval: ${TRADING_REQUIRE_MANUAL_APPROVAL:true}
    # IG's reported minDealSize understates the true demo minimum on some markets (Solana
    # reports 4.0 but rejects below 7). Deal size = reportedMin × this buffer. ×2 verified
    # to clear SOL/BTC/ETH on the demo. Raise if MINIMUM_ORDER_SIZE_ERROR reappears.
    min-size-multiplier: ${TRADING_MIN_SIZE_MULTIPLIER:2}
    # Spread guard. Skip the live IG trade when bid/offer spread is > X% of the planned stop.
    # Prevents low-edge entries where the spread alone consumes the risk budget (common at
    # Sunday open or in thin markets). Set to 0 to disable; 25.0 = 25% of stop.
    max-spread-pct-of-stop: ${TRADING_MAX_SPREAD_PCT_OF_STOP:25.0}
  # When true, sends Telegram CONFIRM/SKIP keyboard on every actionable signal
  # WITHOUT executing real IG trades. Use this for paper trading with manual
  # confirmation — the buy button appears, positions are tracked, but no money moves.
  # Set TRADING_AUTO_EXECUTION_ENABLED=true to graduate to live/semi-live.
  confirmation:
    enabled: ${TRADING_CONFIRMATION_ENABLED:false}

notifications:
  telegram:
    enabled: ${TELEGRAM_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-ids: ${TELEGRAM_CHAT_IDS:}
    
  email:
    enabled: false
    smtp:
      host: ${SMTP_HOST:smtp.gmail.com}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}
    to: ${ALERT_EMAIL:}

archive:
  enabled: ${ARCHIVE_ENABLED:true}
  dir: ${ARCHIVE_DIR:./signal_archive}
  retention-days: ${ARCHIVE_RETENTION_DAYS:90}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tryItOutEnabled: true

watchlist:
  instruments:
    - symbol: SOLUSDT
      name: Solana
      source: BINANCE
      enabled: true
      type: CRYPTO
      oversold-threshold: 30
      overbought-threshold: 70
      timeframes: "15m,1h,4h"
      ig-epic: CS.D.SOLUSD.TODAY.IP
    - symbol: BTCUSDT
      name: Bitcoin
      source: BINANCE
      enabled: true
      type: CRYPTO
      oversold-threshold: 30
      overbought-threshold: 70
      timeframes: "15m,1h,4h"
      ig-epic: CS.D.BITCOIN.TODAY.IP
      # Re-enabled Apr 22 2026 after R:R dropped to 2:1 (was 3:1 and unreachable).
      # SOL's 5/8 win rate under same setup suggests BTC may also perform.
    - symbol: ETHUSDT
      name: Ethereum
      source: BINANCE
      enabled: true
      type: CRYPTO
      oversold-threshold: 30
      overbought-threshold: 70
      timeframes: "15m,1h,4h"
      ig-epic: CS.D.ETHUSD.TODAY.IP
      # Re-enabled Apr 22 2026 alongside BTC — same rationale.
    - symbol: BCHUSDT
      name: Bitcoin Cash
      source: BINANCE
      enabled: false
      type: CRYPTO
      oversold-threshold: 30
      overbought-threshold: 70
      timeframes: "15m,1h,4h"
    # IG instruments — set IG_ENABLED=true and provide IG credentials to activate
    # Find your epic codes at: https://labs.ig.com/sample-apps/api-companion/index.html
    - symbol: IX.D.DAX.DAILY.IP
      name: DAX 40
      source: IG
      enabled: true
      type: INDEX
      oversold-threshold: 30
      overbought-threshold: 70
      timeframes: "15m,30m,1h"
      # Jun 23 2026: re-enabled detection in SILENT mode (notify:false) to gather post-chop-filter
      # forward data — same pattern that rehabilitated S&P (the 0/9 / €901 record predates the May
      # ADX-12 / EMA-slope / MACD filters). No live alerts; tracked in position_outcomes only.
      trend-buy-dip-enabled: true
      trend-buy-dip-notify: false
    - symbol: IX.D.FTSE.DAILY.IP
      name: FTSE 100
      source: IG
      enabled: true
      type: INDEX
      oversold-threshold: 30
      overbought-threshold: 70
      timeframes: "15m,30m,1h"
      trend-buy-dip-enabled: false  # −0.86R backtest (7 signals, 0% TP, 86% SL)
    - symbol: IX.D.SPTRD.DAILY.IP
      name: S&P 500
      source: IG
      enabled: true
      type: INDEX
      oversold-threshold: 30
      overbought-threshold: 70
      timeframes: "15m,30m,1h"
      # Apr 22 2026: silent TREND_BUY_DIP — signals still recorded to position_outcomes
      # for forward P&L tracking, but no Telegram alert. Matches the pattern used to evaluate
      # a signal-type on a new instrument without live-alert noise.
      # May 28 2026: reverted to silent — every recorded S&P dip was a loss, and notify=true
      # was firing live confirm prompts on neutral-RSI false positives.
      # Jun 14 2026: re-enabled notify — after the May chop filters (ADX-15, EMA-slope, MACD)
      # landed, S&P is the best forward performer (2/3 wins, +€209 net est.). Sample is small,
      # so revisit if win rate drops below 50% over the next ~10 trades.
      trend-buy-dip-notify: true
    # Gold — verified epic CS.D.USCGC.TODAY.IP (Spot Gold, XAU/USD proxy)
    - symbol: CS.D.USCGC.TODAY.IP
      name: Gold
      source: IG
      enabled: true
      type: COMMODITY
      oversold-threshold: 30
      overbought-threshold: 70
      timeframes: "15m,1h,4h"
      # Jun 23 2026: re-enabled trend detection in SILENT mode (notify:false) for forward visibility.
      # Low-confidence (−1.00R backtest, 6 signals, 0% TP) — silent so it adds no alert noise.
      trend-buy-dip-enabled: true
      trend-buy-dip-notify: false
      rsi-signals-enabled: false  # May 2026: −1.00R on OVERSOLD/PARTIAL_OVERSOLD too; price data still feeds CrossAssetCorrelationService
    # Oil: FSD (forward) epic expired — switched to USS (cash/rolling) contract
    - symbol: CC.D.LCO.USS.IP
      name: Oil (Brent)
      source: IG
      enabled: true
      type: COMMODITY
      oversold-threshold: 30
      overbought-threshold: 70
      timeframes: "15m,1h,4h"
      # Re-enabled Apr 2026 for cross-asset correlation detection.
      # Oil spikes often precede index/crypto selloffs.
      # RSI signals on oil alone may be noisy — primary use is as leading indicator.
      trend-buy-dip-enabled: false  # May 28 2026: oil is a leading indicator only; commodity dips backtest at −1.00R. Was firing false-positive dips (e.g. 28 May, 15m RSI 49.2).
    - symbol: IX.D.NASDAQ.CASH.IP
      name: Nasdaq 100
      source: IG
      enabled: false
      type: INDEX
      oversold-threshold: 30
      overbought-threshold: 70
      timeframes: "15m,30m,1h"
    - symbol: CS.D.USCSI.TODAY.IP
      name: Silver
      source: IG
      enabled: true   # Jun 23 2026: re-enabled for visibility (adds ~1k IG points/week — see budget note in AGENTS.md)
      type: COMMODITY
      oversold-threshold: 30
      overbought-threshold: 70
      timeframes: "15m,1h,4h"
      # Jun 23 2026: trend detection on in SILENT mode (notify:false). Low-confidence (−1.00R backtest).
      trend-buy-dip-enabled: true
      trend-buy-dip-notify: false
      rsi-signals-enabled: false  # Keep Silver silent-only; trend dips tracked without RSI alert noise
